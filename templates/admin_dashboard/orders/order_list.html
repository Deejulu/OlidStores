{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
:root {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f9fa;
    --bg-tertiary: #e9ecef;
    --text-primary: #1a202c;
    --text-secondary: #4a5568;
    --text-muted: #718096;
    --border-color: #e2e8f0;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / 0.1);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    --accent: #5a67d8;
    --accent-hover: #4c51bf;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
}

[data-theme="dark"] {
    --bg-primary: #1a202c;
    --bg-secondary: #2d3748;
    --bg-tertiary: #4a5568;
    --text-primary: #f7fafc;
    --text-secondary: #e2e8f0;
    --text-muted: #cbd5e0;
    --border-color: #4a5568;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / 0.5);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6);
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
}

.orders-page {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-secondary);
    min-height: 100vh;
    padding: 2rem 0 3rem;
}

.page-header {
    margin-bottom: 2rem;
}

.page-title {
    font-size: 2rem;
    font-weight: 800;
    color: #1a202c !important;
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.01em;
    line-height: 1.2;
}

[data-theme="dark"] .page-title {
    color: #f7fafc !important;
}

.page-subtitle {
    color: #4a5568 !important;
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    line-height: 1.45;
}

[data-theme="dark"] .page-subtitle {
    color: #e2e8f0 !important;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 1.5rem;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

[data-theme="dark"] .stat-card {
    background: #1a202c;
    border-color: #4a5568;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transition: transform 0.3s;
}

.stat-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}

.stat-card:hover::before {
    transform: scaleX(1);
}

.stat-card.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
}

.stat-card.active::before {
    transform: scaleX(1);
}

.stat-icon {
    font-size: 2rem;
    color: var(--accent) !important;
    margin-bottom: 0.75rem;
}

.stat-value {
    font-size: 2rem;
    font-weight: 900;
    color: #1a202c !important;
    margin-bottom: 0.25rem;
    letter-spacing: 0;
    line-height: 1.15;
}

.stat-label {
    color: #4a5568 !important;
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1.4;
}

[data-theme="dark"] .stat-value {
    color: #f7fafc !important;
}

[data-theme="dark"] .stat-label {
    color: #e2e8f0 !important;
}

[data-theme="dark"] .stat-icon {
    color: #a5b4fc !important;
}

.attention-banner {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
}

[data-theme="dark"] .attention-banner {
    background: linear-gradient(135deg, #78350f 0%, #92400e 100%);
    border-color: #d97706;
}

.attention-icon {
    font-size: 2rem;
    color: #d97706;
    flex-shrink: 0;
}

.attention-content h4 {
    color: #78350f;
    font-size: 1rem;
    font-weight: 800;
    margin: 0 0 0.25rem 0;
    letter-spacing: 0;
    line-height: 1.35;
}

[data-theme="dark"] .attention-content h4 {
    color: #fef3c7;
    font-weight: 800;
}

.attention-content p {
    color: #92400e;
    font-size: 0.875rem;
    font-weight: 600;
    margin: 0;
}

[data-theme="dark"] .attention-content p {
    color: #fde68a;
    font-weight: 600;
}

.attention-link {
    margin-left: auto;
    padding: 0.5rem 1rem;
    background: #f59e0b;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.875rem;
    white-space: nowrap;
    transition: all 0.2s;
}

.attention-link:hover {
    background: #d97706;
    color: white;
}

.controls-section {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    box-shadow: var(--shadow-sm);
}

[data-theme="dark"] .controls-section {
    background: #1a202c;
    border-color: #4a5568;
}

.search-wrapper {
    position: relative;
    margin-bottom: 1.5rem;
}

.search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    pointer-events: none;
}

.search-input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 3rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    background: #ffffff;
    color: #1a202c;
    font-size: 0.95rem;
    transition: all 0.2s;
}

[data-theme="dark"] .search-input {
    background: #2d3748;
    border-color: #4a5568;
    color: #f7fafc;
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.search-input::placeholder {
    color: var(--text-secondary);
    opacity: 0.9;
}

.search-clear-btn {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0.25rem;
    transition: color 0.2s;
}

.search-clear-btn:hover {
    color: var(--danger);
}

.search-kbd {
    position: absolute;
    right: 3rem;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.2rem 0.5rem;
    font-size: 0.75rem;
    color: var(--text-primary);
    font-weight: 700;
    font-family: monospace;
    pointer-events: none;
}

.is-hidden {
    display: none;
}

.filter-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
}

.filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: #f8f9fa;
    border: 2px solid transparent;
    border-radius: 50px;
    color: #1a202c !important;
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 700;
    line-height: 1.35;
    cursor: pointer;
    transition: all 0.2s;
}

[data-theme="dark"] .filter-pill {
    background: #2d3748;
    color: #f7fafc !important;
}

.filter-pill:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

.filter-pill.active {
    background: linear-gradient(135deg, var(--accent), #764ba2);
    color: white;
    border-color: var(--accent);
}

.filter-count {
    background: rgba(0, 0, 0, 0.15);
    padding: 0.15rem 0.5rem;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 800;
    line-height: 1.2;
}

.filter-pill.active .filter-count {
    background: rgba(255, 255, 255, 0.25);
    font-weight: 800;
}

.bulk-actions {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}

[data-theme="dark"] .bulk-actions {
    background: #1a202c;
    border-color: #4a5568;
}

.bulk-select-wrapper {
    position: relative;
}

.bulk-select {
    padding: 0.6rem 2.5rem 0.6rem 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    background: #ffffff;
    color: #1a202c;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.35;
    cursor: pointer;
    transition: all 0.2s;
}

[data-theme="dark"] .bulk-select {
    background: #2d3748;
    border-color: #4a5568;
    color: #f7fafc;
}

.bulk-select:focus {
    outline: none;
    border-color: var(--accent);
}

.bulk-arrow {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-secondary);
}

.bulk-btn {
    padding: 0.6rem 1.25rem;
    background: linear-gradient(135deg, var(--accent), #764ba2);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    line-height: 1.35;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s;
}

.bulk-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.bulk-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.selected-count {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-primary);
    font-weight: 700;
    font-size: 0.9rem;
}

.table-wrapper {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
}

[data-theme="dark"] .table-wrapper {
    background: #1a202c;
    border-color: #4a5568;
}

.orders-table {
    width: 100%;
    border-collapse: collapse;
}

.orders-table thead {
    background: #f8f9fa;
}

[data-theme="dark"] .orders-table thead {
    background: #2d3748;
}

.orders-table th {
    padding: 1rem;
    text-align: left;
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #1a202c !important;
    line-height: 1.35;
    border-bottom: 2px solid var(--border-color);
}

[data-theme="dark"] .orders-table th {
    color: #e2e8f0 !important;
}

.orders-table td {
    padding: 1rem;
    border-bottom: 1px solid var(--border-color);
    color: #1a202c !important;
}

[data-theme="dark"] .orders-table td {
    color: #f7fafc !important;
}

.orders-table tbody tr {
    transition: background 0.2s;
}

.orders-table tbody tr:hover {
    background: #f8f9fa;
}

[data-theme="dark"] .orders-table tbody tr:hover {
    background: #2d3748;
}

.orders-table tbody tr.needs-attention {
    background: rgba(251, 191, 36, 0.05);
}

.table-checkbox {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent);
}

.order-id {
    font-weight: 700;
    color: #5a67d8 !important;
    text-decoration: none;
}

[data-theme="dark"] .order-id {
    color: #a5b4fc !important;
}

.order-id:hover {
    text-decoration: underline;
}

.customer-info {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.customer-name {
    font-weight: 700;
    color: #1a202c !important;
}

[data-theme="dark"] .customer-name {
    color: #f7fafc !important;
}

.customer-email {
    font-size: 0.85rem;
    color: #4a5568 !important;
    font-weight: 600;
    line-height: 1.4;
}

[data-theme="dark"] .customer-email {
    color: #cbd5e0 !important;
}

.order-amount {
    font-weight: 800;
    color: var(--text-primary);
    font-size: 0.95rem;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.75rem;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.35;
}

.status-pending {
    background: #fef3c7;
    color: #92400e !important;
}

.status-processing {
    background: #cffafe;
    color: #155e75 !important;
}

.status-shipped {
    background: #dbeafe;
    color: #1e40af !important;
}

.status-delivered, .status-completed {
    background: #d1fae5;
    color: #065f46 !important;
}

.status-cancelled {
    background: #fee2e2;
    color: #991b1b !important;
}

[data-theme="dark"] .status-pending {
    background: #78350f;
    color: #fde68a !important;
}

[data-theme="dark"] .status-processing {
    background: #164e63;
    color: #a5f3fc !important;
}

[data-theme="dark"] .status-shipped {
    background: #1e3a8a;
    color: #bfdbfe !important;
}

[data-theme="dark"] .status-delivered,
[data-theme="dark"] .status-completed {
    background: #064e3b;
    color: #a7f3d0 !important;
}

[data-theme="dark"] .status-cancelled {
    background: #7f1d1d;
    color: #fecaca !important;
}

[data-theme="dark"] .order-id,
[data-theme="dark"] .order-card-id {
    color: #a5b4fc !important;
}

[data-theme="dark"] .action-btn,
[data-theme="dark"] .action-btn:hover {
    color: #ffffff !important;
    background: var(--accent);
}

.filter-pill.active .filter-count {
    background: rgba(0, 0, 0, 0.25);
    color: #ffffff;
}

.order-date {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
}

.order-date .date {
    font-weight: 700;
    color: #1a202c !important;
    font-size: 0.9rem;
    line-height: 1.35;
}

.order-date .time {
    font-size: 0.8rem;
    color: #4a5568 !important;
    font-weight: 600;
    line-height: 1.35;
}

[data-theme="dark"] .order-date .date {
    color: #f7fafc !important;
}

[data-theme="dark"] .order-date .time {
    color: #cbd5e0 !important;
}

.action-btn {
    padding: 0.5rem 1rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.875rem;
    line-height: 1.35;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s;
}

.action-btn:hover {
    background: var(--accent-hover);
    color: white;
    transform: translateY(-1px);
}

.orders-mobile {
    display: none;
}

.order-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-sm);
}

[data-theme="dark"] .order-card {
    background: #1a202c;
    border-color: #4a5568;
}

.order-card.needs-attention {
    border-left: 4px solid #f59e0b;
}

.order-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.order-card-checkbox {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.order-card-id {
    font-weight: 700;
    color: #5a67d8 !important;
    text-decoration: none;
}

[data-theme="dark"] .order-card-id {
    color: #a5b4fc !important;
}

.order-card-amount {
    font-weight: 800;
    font-size: 1.1rem;
    color: #1a202c !important;
}

[data-theme="dark"] .order-card-amount {
    color: #f7fafc !important;
}

.order-card-body {
    padding: 1rem 0;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.order-card-customer {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.order-card-name {
    font-weight: 700;
    color: #1a202c !important;
    line-height: 1.35;
}

[data-theme="dark"] .order-card-name {
    color: #f7fafc !important;
}

.order-card-email {
    font-size: 0.85rem;
    color: #4a5568 !important;
    font-weight: 600;
    line-height: 1.4;
}

[data-theme="dark"] .order-card-email {
    color: #cbd5e0 !important;
}

.order-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
}

.order-card-footer .order-date {
    font-size: 0.85rem;
    color: #1a202c !important;
    font-weight: 600;
    line-height: 1.35;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

[data-theme="dark"] .order-card-footer .order-date {
    color: #e2e8f0 !important;
}

.empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-primary);
}

.empty-state i {
    font-size: 3rem;
    color: var(--text-secondary);
    margin-bottom: 1rem;
}

.empty-state h3 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
    line-height: 1.3;
}

.empty-state p {
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 1.5rem;
    line-height: 1.45;
}

@media (max-width: 992px) {
    .stats-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    
    .table-wrapper {
        display: none;
    }
    
    .orders-mobile {
        display: block;
    }
}

@media (max-width: 768px) {
    .orders-page {
        padding: 1rem 0 2rem;
    }
    
    .page-title {
        font-size: 1.5rem;
    }
    
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
    }
    
    .stat-card {
        padding: 1rem;
    }
    
    .stat-icon {
        font-size: 1.5rem;
    }
    
    .stat-value {
        font-size: 1.5rem;
    }
    
    .attention-banner {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .attention-link {
        margin-left: 0;
        width: 100%;
        text-align: center;
    }
    
    .controls-section {
        padding: 1rem;
    }
    
    .search-kbd {
        display: none;
    }
    
    .filter-pills {
        gap: 0.5rem;
    }
    
    .filter-pill {
        font-size: 0.8rem;
        padding: 0.4rem 0.75rem;
    }
    
    .bulk-actions {
        flex-direction: column;
        align-items: stretch;
    }
    
    .bulk-select-wrapper,
    .bulk-btn {
        width: 100%;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="orders-page">
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Orders Management</h1>
            <p class="page-subtitle">View and manage all customer orders</p>
        </div>

        <!-- Dynamic content (replaced by AJAX on tab switch) -->
        <div id="ordersDynamic">
            {% include 'admin_dashboard/orders/order_list_ajax_partial.html' %}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    const AJAX_URL = "{% url 'admin_dashboard:order_list_ajax' %}";

    function getAjaxUrl(status, search) {
        const url = new URL(AJAX_URL, window.location.origin);
        if (status) url.searchParams.set('status', status);
        if (search) url.searchParams.set('search', search);
        return url.toString();
    }

    function getPageUrl(status, search) {
        const url = new URL(window.location.pathname, window.location.href);
        if (status) url.searchParams.set('status', status);
        if (search) url.searchParams.set('search', search);
        return url.toString();
    }

    function fetchOrders(status, search, push) {
        const ajaxUrl = getAjaxUrl(status, search);
        fetch(ajaxUrl, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            credentials: 'same-origin',
        })
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(data) {
            const dynamicEl = document.getElementById('ordersDynamic');
            if (!dynamicEl) throw new Error('Missing #ordersDynamic');

            const currentSearch = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
            dynamicEl.innerHTML = data.html;

            const newSearchInput = document.getElementById('searchInput');
            if (newSearchInput && currentSearch) {
                newSearchInput.value = currentSearch;
            }

            if (push) {
                const pageUrl = getPageUrl(status, currentSearch);
                history.pushState({ status: status || '', search: currentSearch }, '', pageUrl);
            }

            attachOrderListeners();
        })
        .catch(function(err) {
            console.error('fetchOrders failed:', err);
            const pageUrl = getPageUrl(status, search);
            window.location.assign(pageUrl);
        });
    }

    window.filterOrders = function(status) {
        const search = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
        fetchOrders(status, search, true);
    };

    function attachOrderListeners() {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        if (searchInput) {
            if (clearBtn) {
                clearBtn.style.display = searchInput.value ? 'block' : 'none';
            }
            searchInput.addEventListener('input', function() {
                const btn = document.getElementById('clearSearch');
                if (btn) btn.style.display = this.value ? 'block' : 'none';
            });
        }

        const selectAll = document.getElementById('selectAll');
        const orderCheckboxes = document.querySelectorAll('.order-checkbox');
        if (selectAll) {
            selectAll.addEventListener('change', function() {
                orderCheckboxes.forEach(function(cb) { cb.checked = this.checked; });
                updateBulkActions();
            });
        }
        orderCheckboxes.forEach(function(cb) {
            cb.addEventListener('change', updateBulkActions);
        });
    }

    window.updateBulkActions = function() {
        const bulkBtn = document.getElementById('bulkBtn');
        const selectedCount = document.getElementById('selectedCount');
        const countValue = document.getElementById('countValue');
        const checked = document.querySelectorAll('.order-checkbox:checked').length;

        if (bulkBtn) bulkBtn.disabled = checked === 0;
        if (selectedCount && countValue) {
            if (checked > 0) {
                selectedCount.style.display = 'inline-flex';
                countValue.textContent = checked;
            } else {
                selectedCount.style.display = 'none';
            }
        }
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            selectAll.checked = checked === document.querySelectorAll('.order-checkbox').length && checked > 0;
        }
    };

    window.confirmBulk = function() {
        const action = document.getElementById('bulkAction').value;
        const count = document.querySelectorAll('.order-checkbox:checked').length;

        if (!action) {
            alert('Please select an action');
            return false;
        }

        const actionText = {
            'mark_processing': 'mark as Processing',
            'mark_shipped': 'mark as Shipped',
            'mark_delivered': 'mark as Delivered',
            'mark_cancelled': 'cancel',
            'delete': 'delete'
        };

        return confirm('Are you sure you want to ' + actionText[action] + ' ' + count + ' order(s)?');
    };

    window.clearSearch = function() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        const currentStatus = new URL(window.location).searchParams.get('status') || '';
        fetchOrders(currentStatus, '', true);
    };

    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.focus();
        }
    });

    const searchForm = document.getElementById('searchForm');
    if (searchForm) {
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const search = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
            const currentStatus = new URL(window.location).searchParams.get('status') || '';
            fetchOrders(currentStatus, search, true);
        });
    }

    window.addEventListener('popstate', function(e) {
        const url = new URL(window.location);
        const status = url.searchParams.get('status') || '';
        const search = url.searchParams.get('search') || '';
        fetchOrders(status, search, false);
    });

    attachOrderListeners();
})();
</script>
{% endblock %}
